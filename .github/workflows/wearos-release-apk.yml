name: wearos-release-apk

# Builds ONLY the release APK for the Wear OS app under wearos/.
# No AAB/bundle is produced by this workflow.
on:
  push:
    branches: ["**"]
    paths:
      - "wearos/**"
      - ".github/workflows/wearos-release-apk.yml"
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wearos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install Android platform and build tools
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

  release-apk:
    needs: unit-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wearos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install Android platform and build tools
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Sync latest timetable data into assets
        run: |
          cp ../days.txt app/src/main/assets/days.txt
          cp ../special-date.txt app/src/main/assets/special-date.txt
          cp ../timetable.txt app/src/main/assets/timetable.txt
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
      - name: Assemble release APK only
        env:
          RELEASE_KEYSTORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: timetable-wear-release-apk
          path: wearos/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
