name: Build iOS IPA

on:
  push:
    branches:
      - ios-app
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Timetable.xcodeproj \
            -scheme Timetable

      - name: Build app (no code signing)
        run: |
          set -eo pipefail
          mkdir -p build
          xcodebuild clean archive \
            -project Timetable.xcodeproj \
            -scheme Timetable \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Timetable.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log

      - name: Print archive errors on failure
        if: failure()
        run: |
          echo "xcodebuild failed. Showing last 200 lines:"
          tail -n 200 build/xcodebuild.log || true
          echo "\nFiltered error lines:"
          grep -nE "error:|\*\* ARCHIVE FAILED \*\*|CodeSign|provision" build/xcodebuild.log || true

      - name: Pack unsigned IPA
        run: |
          set -eo pipefail
          mkdir -p build/Payload
          APP_PATH=$(find "$PWD/build/Timetable.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive output"
            exit 1
          fi
          cp -R "$APP_PATH" build/Payload/
          cd build
          /usr/bin/zip -r Timetable-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Timetable-unsigned-ipa
          path: build/Timetable-unsigned.ipa
