name: wearos-baseline-profile

# Manually-triggered: boots a Wear OS emulator and runs the macrobenchmark
# generator (:app:generateReleaseBaselineProfile), then commits the resulting
# baseline-prof.txt back to this branch. That push auto-triggers
# wearos-release-apk.yml, which bakes the profile into the release APK.
#
# Defaults target the latest Wear OS available in the stable SDK repo
# (API 36 = Wear OS 6). API 37 is not published there yet; re-run with
# api-level 37 once it is.
on:
  workflow_dispatch:
    inputs:
      api-level:
        description: "Emulator API level (Wear OS 6 = 36, 5.1 = 35)"
        default: "36"
        type: string
      target:
        description: "System image target"
        default: "android-wear"
        type: string
      arch:
        description: "Emulator arch"
        default: "x86_64"
        type: string

permissions:
  contents: write

concurrency:
  group: baseline-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build prerequisites
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify generate task exists
        run: |
          cd wearos
          chmod +x gradlew
          ./gradlew :app:tasks --all | grep -q "generateReleaseBaselineProfile"

      - name: Generate baseline profile on Wear emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level }}
          target: ${{ inputs.target }}
          arch: ${{ inputs.arch }}
          disable-animations: true
          emulator-options: -no-snapshot -no-audio -no-boot-anim
          script: |
            cd wearos
            chmod +x gradlew
            ./gradlew :app:generateReleaseBaselineProfile --stacktrace

      - name: Collect profile into src
        if: always()
        run: |
          SRC=wearos/app/src/main/baselineProfiles/baseline-prof.txt
          if [ ! -f "$SRC" ]; then
            GEN=$(find wearos/app/build -name 'baseline-prof.txt' 2>/dev/null | head -1)
            if [ -n "$GEN" ]; then
              mkdir -p "$(dirname "$SRC")"
              cp "$GEN" "$SRC"
              echo "copied $GEN"
            else
              echo "no baseline-prof.txt produced"
            fi
          fi

      - name: Upload generated profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: wearos/app/src/main/baselineProfiles/
          if-no-files-found: warn

      - name: Commit profile back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wearos/app/src/main/baselineProfiles
          git diff --cached --quiet && echo "no profile changes" || { git commit -m "WearOS: update baseline profile (emulator API ${{ inputs.api-level }})" && git push; }
