    contents: |
      # cd wearos && ./gradlew :core:assembleDebug :app:assembleDebug :phone:assembleDebug
      # releases: ./gradlew :app:assembleRelease :phone:assembleRelease
  - name: test
    contents: |
      # cd wearos && ./gradlew :core:test :app:testDebugUnitTest :phone:testDebugUnitTest
  - name: emulator
    contents: |
      # export PATH=~/android-sdk/platform-tools:~/android-sdk/emulator:$PATH
