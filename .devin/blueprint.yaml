# https://docs.devin.ai/onboard-devin/environment-yaml
# Android SDK + JDK 17 are already on the VM (ANDROID_HOME=~/android-sdk).
initialize:
  - name: install Wear OS 5.1 system image
    run: yes | ~/android-sdk/cmdline-tools/latest/bin/sdkmanager "system-images;android-35-ext15;android-wear;x86_64" > /dev/null
  - name: create tablet AVD
    run: echo no | ~/android-sdk/cmdline-tools/latest/bin/avdmanager create avd -n timetable_tablet -k "system-images;android-35;google_apis;x86_64" -d pixel_tablet --force
  - name: create wear AVD
    run: echo no | ~/android-sdk/cmdline-tools/latest/bin/avdmanager create avd -n timetable_wear -k "system-images;android-35-ext15;android-wear;x86_64" -d wearos_large_round --force
knowledge:
